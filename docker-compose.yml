version: "3.9"

# Faith-n-Action — production-shaped compose file.
# Keys are mounted as Docker secrets; the SQLite DB lives on a named volume
# for dev-parity, or swap DATABASES via env for PostgreSQL (recommended).

secrets:
  private_key:
    file: ./private_key.pem   # generated by generate_keys.py — NEVER commit
  public_key:
    file: ./public_key.pem

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      SECURE_HSTS_SECONDS: "31536000"
      BEHIND_TLS_PROXY: "True"
      SESSION_SAVE_EVERY_REQUEST: "False"
    volumes:
      - dbdata:/app/data          # SQLite on a volume for dev-parity
      - mediafiles:/app/media
    # To use PostgreSQL instead, provision a db service and set DATABASE_URL;
    # settings.py reads it when present (see DEPLOYMENT.md).
    restart: unless-stopped

volumes:
  dbdata:
  mediafiles:
